# Role permissions are selected by scripts/run-project-agent.ps1, never inferred from a prompt.
[permissions.dsh-code]
extends = ":read-only"
description = "Code worker: source and tests writable; documentation and policy read-only."

[permissions.dsh-code.filesystem.":workspace_roots"]
"." = "read"
"app/src" = "write"
"core" = "read"
"core/common/src" = "write"
"core/data/src" = "write"
"core/design/src" = "write"
"core/device/src" = "write"
"core/render/src" = "write"
"core/widget-api/src" = "write"
"core/weread-sync/src" = "write"
"feature/home/src" = "write"
"feature/settings/src" = "write"
"feature/widgets/src" = "write"
"feature/content/src" = "write"
"feature/files/src" = "write"
"feature/reader/src" = "write"
"feature/tray/src" = "write"
"feature/weread-app/src" = "write"
"service/src" = "write"
"_analysis/agent-output" = "write"

[permissions.dsh-docs]
extends = ":read-only"
description = "Documentation worker: only approved documentation locations writable."

[permissions.dsh-docs.filesystem.":workspace_roots"]
"." = "read"
"docs" = "write"
"memory" = "write"
"PROJECT.md" = "write"
"README.md" = "write"
"_analysis/agent-output" = "write"
