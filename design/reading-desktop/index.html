<script>
const icons={book:'<path d="M8 4h21v27H10a4 4 0 0 1 0-8h19M8 4v23M10 27h19"/>',chat:'<path d="M30 17c0 7-6 12-13 12l-7 4 1-7C4 22 4 12 10 7c8-6 20-1 20 10Z"/><path d="M13 15h.1M22 15h.1"/>',files:'<path d="M4 10h12l3 4h13v18H4Z"/><path d="M4 10V6h12l3 4"/>',gear:'<circle cx="18" cy="18" r="6"/><path d="m15 3 6 0 1 5 4 2 5-1 3 5-4 4v4l3 4-3 5-5-2-4 2-2 4h-6l-1-5-4-2-5 1-3-5 4-4v-4L1 12l3-5 5 2 4-2Z" transform="translate(2 0) scale(.9)"/>',clock:'<circle cx="18" cy="18" r="13"/><path d="M18 9v10l7 4"/>',web:'<circle cx="18" cy="18" r="14"/><ellipse cx="18" cy="18" rx="6" ry="14"/><path d="M4 18h28M7 9h22M7 27h22"/>',music:'<path d="M13 27V8l18-4v19M13 13l18-4"/><ellipse cx="8" cy="28" rx="5" ry="4"/><ellipse cx="26" cy="24" rx="5" ry="4"/>',calc:'<rect x="6" y="3" width="24" height="30" rx="2"/><path d="M10 8h16v6H10ZM11 20h2M23 20h2M11 26h2M23 26h2"/>',wifi:'<path d="M3 12a23 23 0 0 1 30 0M9 19a14 14 0 0 1 18 0M14 25a6 6 0 0 1 8 0M18 31h.1"/>',battery:'<path d="M3 10h27v17H3ZM32 15v7M7 14h17v9H7Z"/>',arrow:'<path d="m14 8 10 10-10 10"/>',note:'<path d="M6 3h24v30H6ZM11 11h14M11 18h14M11 25h8"/>'};
const svg=n=>`<svg viewBox="0 0 36 36" aria-hidden="true">${icons[n]||icons.book}</svg>`;
const appData=[['book','书架'],['chat','微信读书'],['files','文件'],['gear','设置'],['web','浏览器'],['clock','时钟'],['music','音乐'],['calc','计算器']];
const app=(d,action='toast')=>`<a class="app" href="#" data-action="${action}">${svg(d[0])}<label>${d[1]}</label></a>`;
const status=()=>`<div class="status"><span>14:16</span><div class="right">${svg('wifi')}<span>77%</span>${svg('battery')}</div></div>`;
const brand=(sub='阅读桌面')=>`<div class="brand"><b>十雨</b><span>${sub}</span></div>`;
const clock=()=>`<div class="clock"><div class="time">14:16</div><div class="date">10月23日　星期五</div></div>`;
const cover=()=>`<div class="books"><div class="sidebook left">山间来信</div><div class="sidebook right">日常的尺度</div><div class="book"><i class="rule"></i><div class="book-title">雨后书简</div><small>十雨文库</small></div></div>`;
const caption=()=>`<div class="caption"><h1 class="serif">雨后书简</h1><p>读到第六章 · 慢下来的日子</p><div class="progress"><i></i></div><p>已读 55%　·　约剩 4 小时</p></div>`;
const stats=()=>`<div class="stats"><div class="stat"><b>26<span style="display:inline;font-size:15px"> 分钟</span></b><span>今日阅读</span></div><div class="stat"><b>13</b><span>读完书籍</span></div><div class="stat"><b>7<span style="display:inline;font-size:15px"> 天</span></b><span>连续阅读</span></div></div>`;
const dock=()=>`<div class="dock">${app(appData[0])}${app(appData[1])}${app(appData[2])}${app(appData[3],'prefs')}<a class="app" href="#" data-action="drawer"><span class="glyph">»</span><label>全部应用</label></a></div>`;
const title=t=>`<div class="titlebar"><button aria-label="返回" data-action="home">‹</button><h1>${t}</h1></div>`;
const segment=(items,active=0)=>`<div class="seg">${items.map((v,i)=>`<button class="${i===active?'active':''}" data-action="segment">${v}</button>`).join('')}</div>`;
const counter=v=>`<span class="stepper"><button data-action="minus" aria-label="减少">−</button><b>${v}</b><button data-action="plus" aria-label="增加">+</button></span>`;
const row=(name,control)=>`<div class="setting-row"><span>${name}</span>${control}</div>`;
const grid=()=>`<div class="grid">${appData.map(d=>app(d,d[0]==='gear'?'prefs':'toast')).join('')}</div>`;
const noteCopy=`<p>午后的雨停了，窗边的书页仍带着一点潮意。把手机放远一些，只留一盏灯、一杯水，和今天想读完的几页。</p><p>阅读不必总有一个急着抵达的终点。有时，一句话让人停下来，重新看看身边那些熟悉的事物，就已经足够。</p><p>下次打开这本书时，也许会在同一页读到不同的意思。把此刻的想法记在这里，留给以后的自己。</p>`;
const noteCard=(expanded=false)=>`<div class="note-card"><div class="widget-head"><span>本记 · 划线与想法</span><button data-action="toast">换一条 ↻</button></div><div class="meta">雨后书简<br>第六章 · 慢下来的日子</div><div class="note-text ${expanded?'':'note-collapsed'}">${noteCopy}</div><div class="note-actions"><button data-action="toast">‹ 上一条</button><button data-action="toast">换一条 ›</button><button class="expand" data-action="${expanded?'collapse':'expand'}">${expanded?'收起 ↑':'展开 ↓'}</button></div></div>`;
let state=new URLSearchParams(location.search).get('screen');
function render(name){state=name;let content='';let cls=name;
if(name==='immersive')content=status()+brand()+clock()+`<div class="read-main">${cover()}${caption()}${stats()}</div>`+dock();
if(name==='home')content=status()+brand('普通桌面')+`<div class="compact widget">${clock()}<div class="widget-head"><span>本书</span><button data-action="note">本记 ›</button></div>${cover()}${caption()}</div>`+grid()+`<div class="page-dots">● ○ ○</div>`;
if(name==='prefs')content=status()+title('桌面偏好')+`<div class="settings-content"><div class="section"><h2>桌面</h2>${row('桌面模式',segment(['普通','沉浸'],0))}${row('普通桌面',segment(['宫格','列表']))}</div><div class="section grid-controls"><h2>应用布局</h2>${row('首页',`<div class="stepper"><span style="font-size:14px">列</span>${counter(4)}<span class="multiply">×</span><span style="font-size:14px">行</span>${counter(2)}</div>`)}${row('其他页',`<div class="stepper"><span style="font-size:14px">列</span>${counter(4)}<span class="multiply">×</span><span style="font-size:14px">行</span>${counter(5)}</div>`)}</div><div class="section list-controls"><h2>列表布局</h2>${row('首页条数',counter(5))}${row('其他页条数',counter(9))}${row('对齐',segment(['靠左','居中','靠右'],0))}${row('边距',segment(['窄','标准','宽'],1))}</div><div class="section"><h2>显示与操作</h2>${row('显示应用名称','<button class="toggle on" data-action="toggle" aria-label="显示应用名称" aria-pressed="true"></button>')}${row('组件切换',segment(['右滑','上滑','关闭']))}${row('常用应用','<button class="plain" data-action="drawer">选择与排序 ›</button>')}${row('图标与主题','<button class="plain" data-action="icons">设置 ›</button>')}</div></div>`;
if(name==='intro')content=status()+brand('初次见面 · 2 / 4')+`<div class="intro-body"><span class="eyebrow">把书带到桌面</span><h1>要在十雨上<br>使用微信读书吗？</h1><p>查看在读书籍、阅读进度和笔记。<br>用你的微信读书 API Key 连接。</p><div class="intro-illustration">${cover()}</div><p style="font-size:17px">稍后也可以在设置中开启。</p></div><div class="intro-actions"><button class="primary" data-action="key">启用微信读书</button><button class="plain" data-action="home">暂不启用</button></div>`;
if(name==='key')content=status()+title('连接微信读书')+`<div class="key-step"><h2>01　在手机上获取 Key</h2><p>打开微信读书官方页面，按提示获取并复制 API Key。</p><button data-action="toast">显示获取入口</button></div><div class="key-step"><h2>02　把 Key 传到这台设备</h2><p>手机与设备连接同一网络，扫码后粘贴并提交；也可以直接输入。</p><button data-action="toast">显示录入二维码</button><input type="password" placeholder="粘贴 API Key" aria-label="API Key"></div><div class="key-foot"><button class="primary" data-action="toast">验证并继续</button><button class="plain" data-action="home">稍后配置</button></div>`;
if(name==='note'||name==='note-expanded')content=status()+brand('普通桌面')+`<div class="compact">${clock()}</div>`+noteCard(false)+grid()+`<div class="page-dots">● ○ ○</div>`+(name==='note-expanded'?`<div class="note-overlay">${noteCard(true)}</div>`:'');
if(name==='drawer')content=status()+title('全部应用')+`<div class="drawer-list">${appData.map(d=>`<a href="#" class="drawer-row" data-action="toast">${svg(d[0])}<span>${d[1]}</span></a>`).join('')}</div><div class="drawer-bottom"><button data-action="home">退出沉浸模式</button></div>`;
if(name==='landscape'){cls='landscape';content=status()+`<div class="land-body"><div class="land-reading">${brand('沉浸桌面')}${clock()}<div class="read-main">${cover()}<div>${caption()}${stats()}</div></div></div><div class="land-dock">${app(appData[0])}${app(appData[1])}${app(appData[2])}${app(appData[3],'prefs')}<a class="app" href="#" data-action="drawer"><span class="glyph">»</span><label>全部应用</label></a></div></div>`;}
if(name==='icons')content=status()+title('图标与主题')+`<div class="section"><h2>微信读书 · 图标</h2><div class="transparent-preview"><div class="app">${svg('chat')}<label>默认图标</label></div><div class="app transparent"><div class="space"></div><label>微信读书</label></div></div><div class="choice">默认图标 <button data-action="segment">选择</button></div><div class="choice">自选图片 <button data-action="toast">选择 ›</button></div><div class="choice">透明图标 <button class="active" data-action="segment">已选择 ✓</button></div></div><div class="section"><h2>主题导出</h2>${row('图标与透明标记','<span>✓</span>')}${row('桌面布局与名称显示','<span>✓</span>')}${row('桌面壁纸','<span>✓</span>')}<p class="note-info">只保存桌面外观，不包含账号与阅读数据。</p></div><div class="key-foot"><button class="primary" data-action="toast">导出主题</button></div>`;
document.getElementById('root').innerHTML=`<main class="screen ${cls}">${content}</main>`;bind();if(name==='note-expanded'){const overlay=document.querySelector('.note-overlay');const labels=[...document.querySelectorAll('.grid label')];overlay.style.top=document.querySelector('.screen > .note-card').offsetTop+'px';overlay.style.bottom=Math.max(18,innerHeight-Math.max(...labels.map(x=>x.getBoundingClientRect().bottom))-3)+'px';document.querySelector('.screen > .grid').inert=true;document.querySelector('.screen > .note-card').inert=true;}}
function toast(){}
function bind(){document.querySelectorAll('[data-action]').forEach(el=>el.onclick=e=>{e.preventDefault();const a=el.dataset.action;if(['home','drawer','prefs','key','icons','note'].includes(a)){render(a);return}if(a==='expand'){render('note-expanded');return}if(a==='collapse'){render('note');return}if(a==='segment'){el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));el.classList.add('active');if(el.textContent==='列表'||el.textContent==='宫格'){document.querySelector('.list-controls').style.display=el.textContent==='列表'?'block':'none';document.querySelector('.grid-controls').style.display=el.textContent==='列表'?'none':'block';}return}if(a==='toggle'){el.classList.toggle('on');el.setAttribute('aria-pressed',el.classList.contains('on'));return}if(a==='plus'||a==='minus'){const n=el.parentElement.querySelector('b');n.textContent=Math.max(1,Math.min(8,Number(n.textContent)+(a==='plus'?1:-1)));return}toast()});}
const views=[['immersive','01 · 沉浸桌面','书封占主位；阅读统计收成一行，底部保留常用应用与抽屉。'],['home','02 · 普通桌面','组件与应用保持边界；名称、线条和图标使用统一规则。'],['prefs','03 · 桌面偏好','行列各一行；切换宫格／列表，设置只显示对应的数量与对齐选项。'],['intro','04 · 首次引导','先问是否需要，再进入账号连接；提供明确跳过入口。'],['note','05 · 本记收起','长文保留摘要和清楚的展开动作，不挤压应用。'],['note-expanded','06 · 本记展开','白纸阅读层覆盖应用区到最末名称下缘；收起按钮固定可达。'],['drawer','07 · 应用抽屉','完整名称与图标便于查找；显式退出沉浸模式。'],['icons','08 · 图标与主题','透明是图标选择项；主题范围明确展示。'],['key','09 · 连接微信读书','获取与录入分开说明，提交后才验证连接。'],['landscape','10 · 横屏结构','左阅读、右应用；90°与270°使用相同阅读坐标。']];
if(state)render(state);else{document.getElementById('root').innerHTML=`<header class="design-nav"><h1>十雨 · 纸页书桌</h1><p>让书占据视线，让应用随手可达。黑白、直切、清楚的文字与边界。</p><p>2026.10.23 · 待确认设计稿 · 合成书名、封面、笔记与统计 · 点击「单独查看」可体验局部交互；未接入 Android 或真实账号。</p></header><div class="board">${views.map(([id,name,desc])=>`<section class="tile ${id==='landscape'?'wide':''}"><h2>${name}</h2><p>${desc}</p><div class="frame"><iframe title="${name}" src="?screen=${id}"></iframe></div><a class="open-link" href="?screen=${id}">单独查看 ↗</a></section>`).join('')}</div>`;}
</script></body></html>
